[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tiny-email-app"
version = "0.1.0"
description = "Tiny Email App (TEA) - a plain email relay gateway with OAuth and browser automation support."
readme = "README.md"
authors = [{ name = "Tiny Email App Maintainers" }]
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pydantic-settings>=2.4",
    "structlog>=24.1",
    "email-validator>=2.2"
]

[project.optional-dependencies]
playwright = [
    "playwright>=1.46"
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1"
]

[tool.setuptools]
packages = ["tea"]
package-dir = {"tea" = "src/tea"}

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
filterwarnings = [
    "error"
]
asyncio_mode = "auto"
