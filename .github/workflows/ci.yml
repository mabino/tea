name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build test image
        run: docker build -t tea-ci .

      - name: Run tests inside container
        run: >-
          docker run --rm
          -v "$GITHUB_WORKSPACE:/workspace"
          -w /workspace
          -e TEA_MOCK_MODE=true
          tea-ci bash -lc "pip install -e '.[dev]' && pytest --cov=tea --cov-report=term-missing"
